version: 2

models:

  - name: dim_customer
    description: "Customer dimension used for analytical reporting."

    columns:

      - name: CUSTOMERID
        description: "Unique identifier for the customer."
        data_tests:
          - unique
          - not_null

      - name: AGE
        description: "Age of the customer."

      - name: CITY
        description: "City where the customer is located."

      - name: SIGNUPDATE
        description: "Date when the customer signed up."

      - name: CUSTOMER_SEGMENT
        description: "Customer segment assigned to the customer."


  - name: dim_product
    description: "Product dimension used for analytical reporting."

    columns:

      - name: PRODUCTID
        description: "Unique identifier for the product."
        data_tests:
          - unique
          - not_null

      - name: PRODUCTNAME
        description: "Name of the product."

      - name: CATEGORY
        description: "Product category."

      - name: UNITPRICE
        description: "Standard product unit price."


  - name: dim_date
    description: "Date dimension used for time-based analysis."

    columns:

      - name: DATE
        description: "Calendar date."
        data_tests:
          - unique
          - not_null

      - name: YEAR
        description: "Calendar year."

      - name: MONTH
        description: "Calendar month number."

      - name: MONTH_NAME
        description: "Calendar month name."

      - name: DAY
        description: "Day of the month."

      - name: DAY_NAME
        description: "Name of the day."

      - name: WEEK
        description: "Calendar week number."


  - name: fact_orders
    description: "Order-level fact table containing revenue and order metrics."

    columns:

      - name: ORDERID
        description: "Unique identifier for an order."
        data_tests:
          - unique
          - not_null

      - name: CUSTOMERID
        description: "Customer associated with the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: CUSTOMERID

      - name: PRODUCTID
        description: "Product associated with the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: PRODUCTID

      - name: ORDERDATE
        description: "Date on which the order was placed."
        data_tests:
          - not_null

      - name: QUANTITY
        description: "Number of units purchased."

      - name: DISCOUNT
        description: "Discount applied to the order."

      - name: UNITPRICE
        description: "Unit price of the product at the time of the order."

      - name: REVENUE
        description: "Revenue generated by the order."

      - name: ORDER_STATUS
        description: "Current status of the order."

      - name: PAYMENTSTATUS
        description: "Payment status associated with the order."